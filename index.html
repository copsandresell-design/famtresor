<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#911DE6" />
    <meta name="description" content="L'app familiale qui transforme les tâches du quotidien en points, badges et belles progressions." />
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KidsUp" />
    <title>KidsUp — Les tâches qui rapportent des points</title>
    <style>
      /* Écran de chargement maison : affiché instantanément (avant React/Tailwind), retiré
         du DOM juste après le premier rendu (voir src/main.tsx). Volontairement en CSS
         inline dans le <head> plutôt que dans src/index.css, qui n'arrive qu'avec le bundle
         JS — trop tard pour éviter le flash d'écran vide/blanc au lancement. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: radial-gradient(ellipse 900px 600px at 50% 30%, rgb(124 31 224 / 0.25), transparent), #0a0118;
      }
      #app-splash img {
        width: 260px;
        max-width: 75vw;
        height: auto;
      }
      #app-splash .app-splash-bar {
        width: 180px;
        height: 4px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.12);
        overflow: hidden;
      }
      #app-splash .app-splash-bar-fill {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #911DE6, #FF9A00);
        transition: width 150ms linear;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/images/kidsup-logo.png" alt="" />
      <div class="app-splash-bar"><div class="app-splash-bar-fill" id="app-splash-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>
      // Filet de secours de dernier recours, volontairement hors du bundle Vite (donc actif
      // même si /src/main.tsx ne s'exécute jamais) : un visiteur avec un service worker et
      // des caches périmés d'une visite précédente peut se retrouver bloqué sur cet écran de
      // chargement statique indéfiniment — un ancien SW peut intercepter la navigation ou
      // servir des ressources qui ne correspondent plus au HTML fraîchement déployé, avant
      // même que le code React (et son propre filet, voir lib/versionCheck.ts) ait la
      // moindre chance de s'exécuter. Si #app-splash est toujours là passé ce délai, on
      // nettoie tout et on recharge une seule fois (protégé par sessionStorage contre une
      // boucle infinie si le rechargement ne résout rien).
      (function () {
        var RECOVERY_FLAG = 'kidsup_watchdog_recovered'
        var TIMEOUT_MS = 8000
        setTimeout(function () {
          if (!document.getElementById('app-splash')) return // l'app a pris le relais normalement
          try {
            if (sessionStorage.getItem(RECOVERY_FLAG) === '1') return
            sessionStorage.setItem(RECOVERY_FLAG, '1')
          } catch (e) {
            // Stockage indisponible : on tente quand même le nettoyage une fois, sans garde-fou.
          }
          var cleanupTasks = []
          if ('serviceWorker' in navigator) {
            cleanupTasks.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (r) {
                      return r.unregister()
                    }),
                  )
                })
                .catch(function () {}),
            )
          }
          if (window.caches) {
            cleanupTasks.push(
              caches
                .keys()
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return caches.delete(k)
                    }),
                  )
                })
                .catch(function () {}),
            )
          }
          Promise.all(cleanupTasks).finally(function () {
            window.location.reload()
          })
        }, TIMEOUT_MS)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
